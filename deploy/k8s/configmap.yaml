apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-config
  namespace: iot
data:
  # Strimzi bootstrap service — created automatically by the Kafka CR.
  KAFKA_BROKER: "iot-cluster-kafka-bootstrap.iot.svc:9092"
  KAFKA_TOPIC: "iot-data"
  # fsspec URI for model artifacts. Swap the prefix for gs://, abfs://, or file://
  # without code changes.
  MODEL_STORAGE_URI: "s3://iot-models/anomaly"
  # For MinIO / Ceph RGW / corp S3. Omit for AWS public S3.
  S3_ENDPOINT_URL: "https://s3.corp.example.com"
