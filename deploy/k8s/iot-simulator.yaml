apiVersion: v1
kind: ServiceAccount
metadata:
  name: iot-simulator
  namespace: iot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-simulator
  namespace: iot
  labels:
    app.kubernetes.io/name: iot-simulator
    app.kubernetes.io/part-of: iot-health-to-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iot-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iot-simulator
    spec:
      serviceAccountName: iot-simulator
      containers:
        - name: iot-simulator
          image: REGISTRY/iot-health-to-ai/iot-simulator:latest  # set by CI
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iot-config
          env:
            - name: NUM_DEVICES
              value: "10"
            - name: IOT_LOG_DIR
              value: /var/log/iot-simulator
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - name: logs
              mountPath: /var/log/iot-simulator
      volumes:
        - name: logs
          emptyDir: {}
