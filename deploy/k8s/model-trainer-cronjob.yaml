apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-trainer
  namespace: iot
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-trainer
  namespace: iot
  labels:
    app.kubernetes.io/name: model-trainer
    app.kubernetes.io/part-of: iot-health-to-ai
spec:
  # Nightly at 02:17 — off the hour to avoid the global cron stampede.
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: model-trainer
        spec:
          serviceAccountName: model-trainer
          restartPolicy: OnFailure
          containers:
            - name: trainer
              image: REGISTRY/iot-health-to-ai/model-trainer:latest  # set by CI
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: iot-config
                - secretRef:
                    name: model-store-creds   # materialized by ExternalSecret
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits:   {cpu: "2",  memory: 4Gi}
