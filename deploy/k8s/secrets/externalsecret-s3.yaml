# Materializes corp-store credentials as a K8s Secret the app can consume via
# `envFrom: secretRef`. The app never sees OAuth; the operator does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-store-creds
  namespace: iot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corp-secret-store
    kind: SecretStore
  target:
    name: model-store-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: model-store/access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: model-store/secret-access-key
