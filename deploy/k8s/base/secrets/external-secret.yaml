apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: iot-health
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: s3-credentials
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: iot-health/s3
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: iot-health/s3
        property: secret_key
