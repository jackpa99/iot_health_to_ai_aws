name: Build and push images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Parameterised on any OCI registry (Harbor / Artifactory / Nexus / GHCR / Quay / ...).
# Set these repository secrets once:
#   REGISTRY            e.g. harbor.corp.example.com
#   IMAGE_NAMESPACE     e.g. iot-health-to-ai
#   REGISTRY_USERNAME
#   REGISTRY_PASSWORD
env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAMESPACE: ${{ secrets.IMAGE_NAMESPACE }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - iot_simulator
          - kafka_producer
          - spark_streaming
          - anomaly_detection
          - model_trainer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Derive image name
        id: img
        run: |
          # Hyphenate for registry-friendly names
          name="${{ matrix.service }}"
          name="${name//_/-}"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${name}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
