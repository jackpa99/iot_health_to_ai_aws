name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: [Build and push images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to roll out (defaults to the latest commit SHA)"
        required: false
        default: ""

# Portable K8s deploy. Authenticates to the target cluster via a KUBE_CONFIG
# repository secret (base64-encoded kubeconfig, or an OIDC-federated token via
# azure/aws/gcp login actions if preferred).
env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAMESPACE: ${{ secrets.IMAGE_NAMESPACE }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Rewrite image references
        working-directory: deploy/k8s
        run: |
          for svc in iot-simulator spark-streaming model-trainer; do
            kustomize edit set image \
              "REGISTRY/iot-health-to-ai/${svc}=${REGISTRY}/${IMAGE_NAMESPACE}/${svc}:${{ steps.tag.outputs.tag }}"
          done

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          kubectl version --client

      - name: Apply manifests
        run: kubectl apply -k deploy/k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deploy/iot-simulator -n iot --timeout=5m
          kubectl rollout status deploy/spark-streaming -n iot --timeout=10m
