services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  iot_simulator:
    build: ./iot_simulator
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092

  kafka_producer:
    build: ./kafka_producer
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092

  spark_streaming:
    build: ./spark_streaming
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092

  anomaly_detection:
    build: ./anomaly_detection
    depends_on:
      - spark_streaming
    environment:
      - KAFKA_BROKER=kafka:29092

  model_trainer:
    build: ./model_trainer
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      # Pick the backend via URI. Local dev uses a volume; production points at
      # s3:// (or gs:// / abfs://) plus any backend-specific env vars.
      - MODEL_STORAGE_URI=${MODEL_STORAGE_URI:-file:///opt/ml/model}
      # For S3-compatible stores (MinIO / Ceph RGW / corp S3), set:
      #   S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - model_artifacts:/opt/ml/model

volumes:
  model_artifacts:
